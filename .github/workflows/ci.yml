name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # รัน gitleaks ตรงๆ สแกนทั้งประวัติ (gitleaks-action พังกับ commit แรกที่ไม่มี parent)
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact -v .

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Supabase ในเครื่อง (Docker) — ปิด service ที่ test ไม่ใช้ให้เริ่มเร็วขึ้น
      - run: npx supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,mailpit
      - run: npm run test:int
      # ไม่ใช้ --with-deps: runner มี library ของ Chrome อยู่แล้ว และ apt mirror ของ runner ล่มบ่อย
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
